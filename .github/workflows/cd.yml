name: >-
  Docker build image and push to Docker Hub
  then deploy Node.js app to VM via SSH.

on:
  push:
    branches:
      - master

jobs:
  cd:
    runs-on: ubuntu-latest

    steps:
      - name: Print GitHub trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "sha=${{ github.sha }}"
          echo "actor=${{ github.actor }}"
          echo "workflow=${{ github.workflow }}"
          echo "job=${{ github.job }}"
          echo "run_id=${{ github.run_id }}"
          echo "run_number=${{ github.run_number }}"
          echo "event payload path=$GITHUB_EVENT_PATH"
          cat "$GITHUB_EVENT_PATH"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CD phase script
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
          IMAGE_NAME: goldenowl-devops-internship-challenge
          IMAGE_TAG: ${{ github.sha }}
          CONTAINER_NAME: Nodejs-app-container
          APP_CONTAINER_NAMES: Nodejs-app-container goldenowl-nodejs-app
          HOST_PORT: 3000
          CONTAINER_PORT: 3000
        run: bash scripts/cd.sh
