name: >-
  Docker build image and push to Docker Hub
  then trigger AWS Auto Scaling Instance Refresh
  to create new EC2 instance and deploy new application.

on:
  push:
    branches:
      - master

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Print GitHub trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "sha=${{ github.sha }}"
          echo "actor=${{ github.actor }}"
          echo "workflow=${{ github.workflow }}"
          echo "job=${{ github.job }}"
          echo "run_id=${{ github.run_id }}"
          echo "run_number=${{ github.run_number }}"
          echo "event payload path=$GITHUB_EVENT_PATH"
          cat "$GITHUB_EVENT_PATH"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Print Docker build details
        run: |
          docker version
          docker buildx version
          echo "context=./src"
          echo "push=true"
          echo "tag_latest=${{ secrets.DOCKERHUB_USERNAME }}/goldenowl-devops-internship-challenge:latest"
          echo "tag_sha=${{ secrets.DOCKERHUB_USERNAME }}/goldenowl-devops-internship-challenge:${{ github.sha }}"
          ls -la ./src

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/goldenowl-devops-internship-challenge:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/goldenowl-devops-internship-challenge:${{ github.sha }}

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Print GitHub trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "sha=${{ github.sha }}"
          echo "actor=${{ github.actor }}"
          echo "workflow=${{ github.workflow }}"
          echo "job=${{ github.job }}"
          echo "run_id=${{ github.run_id }}"
          echo "run_number=${{ github.run_number }}"
          echo "event payload path=$GITHUB_EVENT_PATH"
          cat "$GITHUB_EVENT_PATH"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743186642343:role/github-actions-asg-refresh-role
          aws-region: ap-southeast-1

      - name: Print AWS deploy details
        run: |
          aws sts get-caller-identity
          aws configure list
          echo "auto_scaling_group=Nodejs-app-asg"
          echo "min_healthy_percentage=50"

      - name: Trigger AWS Auto Scaling Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name Nodejs-app-asg \
            --preferences '{"MinHealthyPercentage": 50}'
