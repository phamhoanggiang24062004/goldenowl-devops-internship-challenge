name: CI phase

on:
  push:
    branches:
      - "feature/**"
      - "feat/**"

  pull_request:
    branches:
      - master

jobs:
  ci_test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test